# GitLab CI version of .github/workflows/test.yml.
#
# Keycloak (the login.gov stand-in) runs as a service container reachable at
# http://keycloak:8180. Service containers can't mount files from the repo, so
# the realm is created through Keycloak's admin API (ci/import-realm.mjs)
# instead of --import-realm. The app and the browser both use the
# `keycloak` hostname, so OIDC_ISSUER points the app at it.

stages:
  - test

e2e:
  stage: test
  # Playwright's image has Node and Chromium's system libraries. Keep the tag
  # close to the @playwright/test version in tests/package-lock.json.
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  services:
    - name: quay.io/keycloak/keycloak:26.0
      alias: keycloak
      command: ["start-dev", "--http-port=8180"]
  variables:
    # Read by the Keycloak service (job variables are passed to services) and by ci/import-realm.mjs.
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    # Read by app/server.mjs.
    OIDC_ISSUER: http://keycloak:8180/realms/logingov-local
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - tests/package-lock.json
    paths:
      - .npm/
  script:
    - node ci/wait-for.mjs http://keycloak:8180/realms/master 180
    - node ci/import-realm.mjs http://keycloak:8180
    - node app/server.mjs > app.log 2>&1 &
    - node ci/wait-for.mjs http://localhost:4100/auth/start 30
    - cd tests
    - npm ci
    - npx playwright install chromium   # no-op when the image already has this version
    - cp .env.example .env
    - WORKERS=4 npm test
  after_script:
    - cat app.log || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/cucumber-report/
      - tests/test-results/
    reports:
      junit: tests/cucumber-report/junit.xml
